  - id: Q-1
    title: QuantumFog 接入斷橋戰場（核心整合）
    source: quantum-gameplay-modeling research §2
    summary: >
      敵方小隊進場時註冊為 UncertainEntity（候選格由人格/地形推先驗）；
      未觀測小隊以機率雲渲染（GetCloud），情報卡或偵查 doctrine 動作
      觸發 Observe 塌縮；情報時效到回疊加。BattleSceneSync 需同步
      revealed 狀態與雲分佈到場景層。
    acceptance:
      - DuanqiaoPlayable 中未觀測敵軍顯示機率雲而非實體標記
      - 情報點消費 → Observe → 顯示真實位置；intelDuration 過期回雲
      - doctrine「偵查」類 action 可觸發觀測（走既有 ActionType 或新增）
      - QuantumFogTest / BattleControllerTest / DoctrineBattleDemo 無回歸
    status: done
    note: >
      commit aa51f42。Reveal(免費)/EliminateCandidate(負面觀測消雲)、
      Scout doctrine、IsHiddenByFog 感知閘、sync 雲標記、demo 情報經濟。
      兩路 review 修完:Scout 卡死、情報洩漏、marker 殘留、Detach 懸空。
    size: XL

  - id: Q-2
    title: 糾纏小隊：測 A 即知 B
    source: research §5 limits「multi-entity correlations 未暴露」
    summary: >
      QuantumFog.Entangle(a, b)：觀測 A 時 B 同步塌縮到相關候選
      （如佯攻隊與主力同向）。實作用共享 joint qudit
      （dim = candA × candB）；QubitRegister 的 CNOT 為位元級參考。
      doctrine 卡範例：「連坐偵查」。
    acceptance:
      - Entangle API + 測試：observe A 後 B 機率集中於相關候選格
      - 單獨觀測 B 的行為（對稱/非對稱）在 spec 寫死
      - 至少一張 doctrine 卡或 demo 情境使用 Entangle
    status: queued
    size: M

  - id: Q-3
    title: 弱觀測 Probe：廉價部分塌縮
    source: 情報點經濟（brief：觀察/道權主題）
    summary: >
      Probe(entityId, strength)：不付全額情報點，機率雲向真值方向
      收縮（amplitude reweight）但不完全塌縮——弱測量。
      花費與收縮強度掛鉤，可連續逼近。
    acceptance:
      - Probe 後候選機率方差下降且仍 >1 個非零候選
      - 費用 < Observe；重複 Probe 可逼近塌縮
      - QuantumTest 覆蓋機率單調收斂 + 不歸一化防護
    status: queued
    size: M

