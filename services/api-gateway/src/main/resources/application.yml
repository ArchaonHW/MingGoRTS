server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      routes:
        - id: roster-service
          uri: lb://roster-service
          predicates:
            - Path=/api/cards,/api/cards/**,/api/rosters,/api/rosters/**
        - id: replay-service
          uri: lb://replay-service
          predicates:
            - Path=/api/replays,/api/replays/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
