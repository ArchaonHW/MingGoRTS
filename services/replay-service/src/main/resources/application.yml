server:
  port: 8082

spring:
  application:
    name: replay-service
  datasource:
    url: jdbc:h2:file:${DB_DIR:./services/data}/replay
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    parser:
      # Reject JSON documents with duplicate keys (e.g. two "schema" fields).
      strict-duplicate-detection: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
